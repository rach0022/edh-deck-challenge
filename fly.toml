# ─── Fly.io Configuration — EDH Deck Challenge ──────────────────────────────
# Deploy:
#   cd backend && fly launch --dockerfile Dockerfile
#   fly secrets set UPSTASH_REDIS_REST_URL=... UPSTASH_REDIS_REST_TOKEN=...
#   fly deploy
#
# Free tier: 3 shared VMs (256MB each), 3GB persistent storage.

app = "edh-deck-challenge"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  CACHE_DRIVER = "upstash"
  PUPPETEER_HEADLESS = "true"
  CACHE_TTL_SECONDS = "900"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 3000
    timeout = "10s"
    type = "http"
