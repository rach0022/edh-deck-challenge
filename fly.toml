# ─── Fly.io Configuration — EDH Deck Challenge ──────────────────────────────
# Deploy:
#   fly deploy
#   fly secrets set UPSTASH_REDIS_REST_URL=... UPSTASH_REDIS_REST_TOKEN=...

app = 'edh-deck-challenge'
primary_region = 'ewr'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  CACHE_DRIVER = "upstash"
  PUPPETEER_HEADLESS = "true"
  CACHE_TTL_SECONDS = "900"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 3000
    timeout = "10s"
    type = "http"
