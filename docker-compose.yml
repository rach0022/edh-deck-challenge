# ─── EDH Deck Challenge — Local Development ─────────────────────────────────
# Run: docker compose up --build
# Access: http://localhost:3000

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CACHE_DRIVER=redis
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECONDS=900
      - PUPPETEER_HEADLESS=true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
